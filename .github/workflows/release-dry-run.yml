name: Release dry run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Non-publishing release arm64
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.2.0"
      - name: Set up uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098 # v7.3.1
        with:
          version: "0.9.26"
          checksum: fcf0a9ea6599c6ae28a4c854ac6da76f2c889354d7c36ce136ef071f7ab9721f
      - name: Record tool versions
        run: |
          sw_vers
          test "$(uname -m)" = "arm64"
          swift --version | tee /tmp/swift-version.txt
          grep -Eq 'Swift version 6\.2(\.0)?([[:space:]]|$)' /tmp/swift-version.txt
          uv --version
          test "$(uv --version | awk '{print $2}')" = "0.9.26"
      - name: Run repository gates
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
          ZETA_SWIFT_TOOLCHAIN_CONFIGURED: "1"
          ZETA_SKIP_SWIFT_TESTS: "1"
        run: scripts/check-repository.sh
      - name: Build unsigned local artifacts
        run: scripts/build-release.sh --arch arm64 --out "$PWD/release-output"
      - name: Verify artifact checksums and installation
        run: |
          cd release-output
          shasum -a 256 -c SHA256SUMS
          cd ..
          prefix="$(mktemp -d)/install"
          PREFIX="$prefix" scripts/install.sh "$PWD/release-output"
          "$prefix/bin/zeta" --help
          "$prefix/bin/pi" --version
          "$prefix/bin/zeta" --list-models=openai | grep -q 'openai/'
          PREFIX="$prefix" scripts/uninstall.sh
          test ! -e "$prefix/bin/zeta"
          test ! -e "$prefix/bin/pi"
          scripts/check-release-smoke.sh "$PWD/release-output"
      - name: Retain unsigned dry-run artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: zeta-unsigned-arm64
          path: release-output/
          if-no-files-found: error
          retention-days: 7

# This workflow intentionally has no tag, release, registry, signing, or notarization permissions or steps.
